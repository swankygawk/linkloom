services:
  db:
    image: postgres:16.10-alpine
    container_name: linkloom_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    container_name: linkloom_api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"

  client:
    build:
      context: ./client
    container_name: linkloom_client
    restart: always
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local